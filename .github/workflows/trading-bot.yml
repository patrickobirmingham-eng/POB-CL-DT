name: ORB Paper Trading Bot

# Runs the strategy in two back-to-back scheduled sessions covering the trading
# day (9:30 AM - 3:45 PM ET), because a single GitHub Actions job is capped at
# 6 hours and the full session is 6h15m. State (opening ranges, trades taken
# today, circuit-breaker counters) is handed from session 1 to session 2 via
# state.json, committed back to the repo at the end of each run.
#
# IMPORTANT — Daylight Saving Time: the cron times below are in UTC and are set
# for Eastern *Daylight* Time (UTC-4, roughly mid-March to early November). When
# the US switches to Eastern *Standard* Time (UTC-5, roughly early November to
# mid-March) each cron time needs to shift one hour LATER in UTC. See the
# comments next to each schedule line for the EST version.
#
# Morning session: 9:30 AM - 1:00 PM ET  = 13:30 UTC (EDT) / 14:30 UTC (EST)
# Afternoon session: 1:00 PM - 3:50 PM ET = 17:00 UTC (EDT) / 18:00 UTC (EST)
#
# NOTE on the exact minutes below: GitHub documents that scheduled workflows can
# be delayed, or silently dropped, during high load — and load is worst right at
# the top of the hour and half-hour (":00"/":30"), since that's where most repos'
# crons cluster. The original schedule used exactly "13:30" and "17:00", which is
# the likely reason neither run fired on its own. Offsetting by a few minutes
# avoids that congestion. The "Determine session window" step below just checks
# whether the UTC hour is before 15, so this small shift doesn't change when the
# bot actually starts trading.

on:
  schedule:
    - cron: "33 13 * * 1-5"   # ~9:33 AM ET (EDT) — session start, weekdays (off :30 to dodge peak load)
    - cron: "4 17 * * 1-5"    # ~1:04 PM ET (EDT) — session continue, weekdays (off :00 to dodge peak load)
  workflow_dispatch:            # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit state.json / trade_log.csv back

concurrency:
  group: orb-trading-bot
  cancel-in-progress: false   # never cancel a run mid-session; let it finish and save state

jobs:
  run-session:
    runs-on: ubuntu-latest
    timeout-minutes: 210   # safety cap per job (3.5h) — well under GitHub's 6h hard limit
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine session window
        id: window
        run: |
          # cron sets GITHUB_EVENT_SCHEDULE-ish context isn't directly available,
          # so we infer the session from the current UTC hour instead.
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 15 ]; then
            echo "start=09:30" >> "$GITHUB_OUTPUT"
            echo "end=13:00" >> "$GITHUB_OUTPUT"
          else
            echo "start=13:00" >> "$GITHUB_OUTPUT"
            echo "end=15:50" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        # live_bot.py now commits + pushes docs/index.html itself after every
        # trade (so the dashboard updates live, not just at end of session), so
        # git needs an identity set up before that step runs, not only at the end.
        run: |
          git config user.name "orb-trading-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run bot session
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python live_bot.py \
            --session-start "${{ steps.window.outputs.start }}" \
            --session-end "${{ steps.window.outputs.end }}" \
            --state-file state.json

      - name: Generate dashboard
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python dashboard.py

      - name: Commit updated state, logs, and dashboard
        run: |
          git config user.name "orb-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          # Add each file individually and only if it exists — trade_log.csv in
          # particular won't exist yet on days with no trades, and `git add` fails
          # for ALL listed paths (not just the missing one) if any single path
          # doesn't match, which was silently dropping every other file too.
          for f in state.json trade_log.csv docs/index.html docs/.nojekyll; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Update bot state and dashboard [skip ci]"

          # The repo can move ahead between this job's checkout and this push (e.g. you
          # pushed a manual edit from GitHub Desktop while this job was running). Rebase
          # onto whatever's newest on the remote right before pushing, retrying a few
          # times, instead of failing outright on a non-fast-forward rejection.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              break
            fi
            echo "Push rejected (attempt $i) — pulling latest and retrying..."
            git pull --rebase origin main
            if [ "$i" -eq 5 ]; then
              echo "Push still failing after 5 attempts — giving up for this run."
              exit 1
            fi
          done
