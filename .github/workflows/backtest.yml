name: Run Backtest

# Manual-only. Downloads historical minute bars and simulates the strategy —
# read-only market data, never places orders, never commits anything. Results
# show on the run's Summary page; the per-trade CSVs are attached as an
# artifact. Uses the current settings.json values (config.py loads them).

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trading days to test"
        default: "90"
        required: true
      equity:
        description: "Account size used for position sizing ($)"
        default: "100000"
        required: true
      symbols:
        description: "Symbols for research-intraday-momentum (comma separated)"
        default: "SPY,QQQ"
        required: false
      comparison:
        description: "What to compare"
        type: choice
        options:
          - research-inplay-orb
          - research-intraday-momentum
          - in-play
          - settings
          - market-filter
          - shorts
          - none
        default: in-play

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if [ "${{ inputs.comparison }}" = "research-intraday-momentum" ]; then
            # Published SPY/QQQ noise-area momentum strategy, 2016 to now (days input unused)
            python research_spy_momentum.py --start 2016-01-01 --symbols "${{ inputs.symbols || 'SPY,QQQ' }}"
            exit 0
          fi
          if [ "${{ inputs.comparison }}" = "research-inplay-orb" ]; then
            # Published 5-min ORB on stocks in play, full-market (SIP) data
            python research_orb_inplay.py --days "${{ inputs.days }}"
            exit 0
          fi
          case "${{ inputs.comparison }}" in
            in-play)       FLAG="--compare-in-play" ;;
            settings)      FLAG="--compare-settings" ;;
            market-filter) FLAG="--compare-market-filter" ;;
            shorts)        FLAG="--compare-shorts" ;;
            *)             FLAG="" ;;
          esac
          python backtest.py --days "${{ inputs.days }}" --equity "${{ inputs.equity }}" $FLAG

      - name: Upload trade lists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: |
            backtest_*.csv
            research_*.csv
          if-no-files-found: ignore
