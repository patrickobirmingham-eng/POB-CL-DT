name: Fetch option price history (research)

# Downloads hourly bars for a list of option contracts so a past trade log can
# be replayed offline. Takes only contract names + date windows (compressed);
# the result is a short-lived artifact. Places no orders, commits nothing.

on:
  workflow_dispatch:
    inputs:
      contracts_b64:
        description: "base64(gzip('OCC,YYYYMMDD,YYYYMMDD;...')) - leave empty with cleanup"
        required: false
      cleanup:
        description: "Only delete the temporary tmp-research-data branch"
        type: boolean
        default: false

permissions:
  contents: write   # only to hand the file over on a temporary branch (see last step)

jobs:
  cleanup:
    if: inputs.cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push origin --delete tmp-research-data || echo "nothing to delete"

  fetch:
    if: ${{ !inputs.cleanup }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch bars
        env:
          SPREADS_APCA_API_KEY_ID: ${{ secrets.SPREADS_APCA_API_KEY_ID }}
          SPREADS_APCA_API_SECRET_KEY: ${{ secrets.SPREADS_APCA_API_SECRET_KEY }}
          CONTRACTS_B64: ${{ inputs.contracts_b64 }}
        run: python scripts/fetch_option_bars.py
      - uses: actions/upload-artifact@v4
        with:
          name: option-bars
          path: option_bars.json.gz
          retention-days: 1
      # Artifacts download from a separate file host that Claude's sandbox can't
      # reach, so the same file is also pushed to a throwaway branch, which is
      # deleted right after it has been copied.
      - name: Hand over via temporary branch
        run: |
          git config user.name "research-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp option_bars.json.gz /tmp/out/
          git checkout --orphan tmp-research-data
          git rm -rfq . && cp /tmp/out/option_bars.json.gz .
          git add option_bars.json.gz && git commit -qm "temporary research data (delete after copying)"
          git push -qf origin tmp-research-data
