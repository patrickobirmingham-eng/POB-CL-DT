name: ORB Bot Watchdog

# The main trading bot (trading-bot.yml) relies on GitHub Actions' `schedule`
# trigger, which GitHub documents as best-effort — it can be delayed or
# silently dropped entirely during high load. That's bitten us more than
# once: mornings where 9:30 AM ET came and went with no run at all, caught
# only because someone happened to check the dashboard and manually clicked
# "Run workflow".
#
# This workflow is the backstop. It runs every 15 minutes during market
# hours and asks one question: "has trading-bot.yml been triggered at all
# today (scheduled OR manual)?" If not, it fires trading-bot.yml itself via
# the API. Because it checks every 15 minutes rather than relying on two
# specific cron firings a day, the odds of GitHub dropping enough
# consecutive checks to matter are far lower than the odds of it dropping
# one specific firing — so a missed morning self-heals within ~15 minutes
# instead of requiring a person to notice and intervene.
#
# IMPORTANT — Daylight Saving Time: same caveat as trading-bot.yml. The cron
# below is set for Eastern *Daylight* Time (UTC-4). When the US switches to
# Eastern *Standard* Time (UTC-5, early November–mid March), shift the hours
# one hour LATER in UTC (13-19 becomes 14-20).
#
# Market hours checked: 9:30 AM - 3:50 PM ET = 13:30-19:50 UTC (EDT).

on:
  schedule:
    - cron: "*/15 13-19 * * 1-5"   # every 15 min, ~9:30 AM - ~3:45 PM ET (EDT), weekdays
  workflow_dispatch:                 # lets you trigger a check manually from the Actions tab

permissions:
  actions: write   # needed to trigger trading-bot.yml via the API
  contents: read

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether the bot has run today, and trigger it if not
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TODAY_ET=$(TZ="America/New_York" date +%F)
          echo "Today (ET): $TODAY_ET"

          # Pull the most recent runs of the main bot workflow and check
          # whether any of them were CREATED today, in Eastern time — this
          # counts a run whether it came from the schedule trigger, a manual
          # click, or (now) this watchdog, so it never double-triggers.
          RUNS_JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/trading-bot.yml/runs?per_page=20")

          RAN_TODAY=$(echo "$RUNS_JSON" | python3 -c "
          import json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          data = json.load(sys.stdin)
          et = ZoneInfo('America/New_York')
          today = datetime.now(et).date()

          found = False
          for run in data.get('workflow_runs', []):
              created = datetime.fromisoformat(run['created_at'].replace('Z', '+00:00')).astimezone(et)
              if created.date() == today:
                  found = True
                  print(f\"::notice::Found existing run today: #{run['run_number']} ({run['event']}, {run['status']}) at {created}\", file=sys.stderr)
                  break
          print('true' if found else 'false')
          ")

          if [ "$RAN_TODAY" = "true" ]; then
            echo "Bot already ran (or was triggered) today — nothing to do."
            exit 0
          fi

          echo "No run found for today yet — triggering trading-bot.yml now."
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/trading-bot.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Triggered. It will show up on the Actions tab as a workflow_dispatch run."
