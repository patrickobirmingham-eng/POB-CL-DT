name: Refresh Dashboard Only

# A lightweight, manual-only workflow that just regenerates docs/index.html
# from current Alpaca account state and commits it — no trading logic, no
# waiting on market hours, no chance of placing an order. Use this when you
# just want the dashboard to pick up a template change (layout, styling,
# etc.) or show fresh data right now, without running a full bot session.

on:
  workflow_dispatch:   # trigger manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit docs/index.html back

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          DASHBOARD_REFRESH_URL: ${{ vars.DASHBOARD_REFRESH_URL }}
          DASHBOARD_REFRESH_TOKEN: ${{ vars.DASHBOARD_REFRESH_TOKEN }}
          DASHBOARD_SETTINGS_SAVE_URL: ${{ vars.DASHBOARD_SETTINGS_SAVE_URL }}
        run: python dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "orb-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          git diff --cached --quiet || git commit -m "Refresh dashboard only [skip ci]"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              break
            fi
            echo "Push rejected (attempt $i) — pulling latest and retrying..."
            git pull --rebase origin main
            if [ "$i" -eq 5 ]; then
              echo "Push still failing after 5 attempts — giving up for this run."
              exit 1
            fi
          done
